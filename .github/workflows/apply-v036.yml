name: Apply Smart Sync v0.3.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v036:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply v0.3.6
        run: |
          unzip -o WA-Alothmany-Sync-v0.3.6-PATCH.zip
          bash APPLY_SYNC_V036.sh
