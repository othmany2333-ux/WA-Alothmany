name: Apply Clean Smart Sync v0.3.7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wa-al-othmany-debug-keystore-v1

      - name: Create debug signing key if missing
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=WA Al-othmany,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install complete clean sync files
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt'
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_service_config.xml')"
          echo '' | base64 -d > 'app/src/main/res/xml/accessibility_service_config.xml'

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          s, c1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 11', s, count=1)
          s, c2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.3.7"', s, count=1)

          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not update app version safely")

          p.write_text(s, encoding="utf-8")
          PY

          # Remove only the failed temporary v0.3.6 application workflows.
          rm -f .github/workflows/apply-v036.yml
          rm -f .github/workflows/apply-v036-fix.yml
          rm -f .github/workflows/apply-v036-direct.yml

          # Structural safety checks: no Groups-filter automation and required path exists.
          ! grep -q 'GROUP_FILTER_LABELS' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'Smart Sync v0.3.7 CLEAN' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'WhatsAppUiBridge.scrollForward()' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'ARCHIVED_LABELS' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'versionName = "0.3.7"' app/build.gradle.kts

          git diff --check

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile clean v0.3.7
        run: ./gradlew assembleDebug --stacktrace

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-al-othmany-debug-v0.3.7-clean
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit only after build and tests pass
        run: |
          set -euo pipefail
          git add             app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt             app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt             app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt             app/src/main/res/xml/accessibility_service_config.xml             app/build.gradle.kts             .github/workflows

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Clean Smart Sync v0.3.7 is already applied."
            exit 0
          fi

          git commit -m "Install Clean Smart Sync v0.3.7 [skip ci]"
          git push origin main
