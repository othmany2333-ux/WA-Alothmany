name: Install Smart Sync v0.4.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wa-al-othmany-debug-keystore-v1

      - name: Create debug signing key if missing
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=WA Al-othmany,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Install complete v0.4 files
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt'
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_service_config.xml')"
          echo '' | base64 -d > 'app/src/main/res/xml/accessibility_service_config.xml'
          mkdir -p "$(dirname 'app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV04RegressionTest.kt')"
          echo '' | base64 -d > 'app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV04RegressionTest.kt'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname '.github/workflows/android.yml')"
          echo '' | base64 -d > '.github/workflows/android.yml'

      - name: Verify exact file payload
        run: |
          set -euo pipefail
          echo "0ec3b8e97f312f4ff4a14a5c143d702549928287cb1a18b532cca55c468ce0c3  app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt" | sha256sum -c -
          echo "332891889988effbcb51d6a9b7521deb219f72dba02bde464e194f71f8b0d09d  app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt" | sha256sum -c -
          echo "5556eca7b297b198da03da676d26e54d76dce394e5e80634f71d961ae255ffba  app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt" | sha256sum -c -
          echo "ebb0b691cde63a9ff15361afdef47890ae2cb4ac338b7ebbb42349ef2967903b  app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt" | sha256sum -c -
          echo "2a6e3a62e4f3bebbb46bf1a0530154576773da4fd484ba0b9314971e9e79d224  app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt" | sha256sum -c -
          echo "a664f0f1f8f57b4bb7e02b8b3aa496fb1108e3612a8a89b8e1933c468d8b2e32  app/src/main/res/xml/accessibility_service_config.xml" | sha256sum -c -
          echo "1e258a345afd498ab650488d71e94d664b35e6d4b2d95290c52e0b0b3214bec3  app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV04RegressionTest.kt" | sha256sum -c -
          echo "3eaf44945f2b54e3f2653d11103c16a0120863fdc24fa57449404b41cc9725f1  app/build.gradle.kts" | sha256sum -c -
          echo "e0dd4901723e4fc737ee9e318a8cbe0090dba027441f2e809ed1888f6cedb327  .github/workflows/android.yml" | sha256sum -c -
          ! grep -q 'GROUP_FILTER_LABELS' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'gestureScrollForward' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'filterAllSelectedIsNeverAGroup' app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV04RegressionTest.kt
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          git diff --check

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile v0.4.0
        run: ./gradlew assembleDebug --stacktrace

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-al-othmany-debug-v0.4.0
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit only after build and tests pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/apply-v036.yml
          rm -f .github/workflows/apply-v036-fix.yml
          rm -f .github/workflows/apply-v036-direct.yml
          rm -f .github/workflows/apply-clean-sync-v037.yml

          git add             app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt             app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt             app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt             app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt             app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt             app/src/main/res/xml/accessibility_service_config.xml             app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV04RegressionTest.kt             app/build.gradle.kts             .github/workflows

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Smart Sync v0.4.0 is already installed."
            exit 0
          fi

          git commit -m "Install Smart Sync v0.4.0 [skip ci]"
          git push origin main
