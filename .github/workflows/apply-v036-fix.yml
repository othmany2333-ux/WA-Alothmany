name: Apply Smart Sync v0.3.6 FIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v036-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract v0.3.6 patch
        run: unzip -o WA-Alothmany-Sync-v0.3.6-PATCH.zip

      - name: Make installer compatible with current ScreenDetector
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt")
          s = p.read_text(encoding="utf-8")

          old = '''        // Strongest rule: visible Chats tab/title + any credible list evidence.
          if ((chatTabVisible || chatHeaderVisible) && listEvidence && !negativeTopSurface) {
              return WhatsAppSurface.CHAT_LIST
          }
          '''

          new = '''        // Samsung/WhatsApp compatibility: known negative surfaces are rejected
          // first, so an explicit Chats tab is a safe home-screen signal even when
          // RecyclerView/row semantics are hidden from Accessibility.
          if ((chatTabVisible || chatHeaderVisible) && !negativeTopSurface) {
              return WhatsAppSurface.CHAT_LIST
          }
          '''

          if old in s:
              s = s.replace(old, new, 1)
          elif "an explicit Chats tab is a safe home-screen signal" not in s:
              raise SystemExit("Could not adapt current ScreenDetector safely")

          p.write_text(s, encoding="utf-8")
          print("ScreenDetector compatibility adjustment: OK")
          PY

      - name: Apply v0.3.6
        run: bash APPLY_SYNC_V036.sh
