name: Install Smart Sync v0.4.1 FINAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wa-al-othmany-debug-keystore-v1

      - name: Create debug signing key if missing
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=WA Al-othmany,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Install v0.4.1 source files
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/SyncViewModel.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/SyncViewModel.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/SyncScreen.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/SyncScreen.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/feature/sync/model/SyncModels.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/feature/sync/model/SyncModels.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/data/local/dao/Daos.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/data/local/dao/Daos.kt'
          mkdir -p "$(dirname 'app/src/main/java/com/alothmany/wa/data/local/dao/SyncDaos.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alothmany/wa/data/local/dao/SyncDaos.kt'
          mkdir -p "$(dirname 'app/src/main/res/values/sync_strings.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/sync_strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/values-ar/sync_strings.xml')"
          echo '' | base64 -d > 'app/src/main/res/values-ar/sync_strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_service_config.xml')"
          echo '' | base64 -d > 'app/src/main/res/xml/accessibility_service_config.xml'
          mkdir -p "$(dirname 'app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV041RegressionTest.kt')"
          echo '' | base64 -d > 'app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV041RegressionTest.kt'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          echo '' | base64 -d > 'app/build.gradle.kts'

      - name: Validate v0.4.1 payload
        run: |
          set -euo pipefail
          echo "d6df17af0b40674c1af31d358b8a72af94766b5727290694202cb1a44a401894  app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt" | sha256sum -c -
          echo "f87293373f6f28277955bad1cd4367ce5687cdf659ad7db3a7ec5a9a118803ce  app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt" | sha256sum -c -
          echo "ed885d9ce73c109b8453891d249bb90ee3edb8eed68b65bf2a41ae293fae2ee8  app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt" | sha256sum -c -
          echo "c99000ccc6548512bbd2dc297db8c98bb2240771606df94f3b3232b771ddee06  app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt" | sha256sum -c -
          echo "b6d213c8589da1bc6a6c894e31494b4bee3debe3ab275a74262729d327d220e6  app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt" | sha256sum -c -
          echo "cf6c869fcb129ee442d5f1cd2c17aff983397e822038dea53a1c75b306e63496  app/src/main/java/com/alothmany/wa/feature/sync/SyncViewModel.kt" | sha256sum -c -
          echo "ecefd2639fb9855ae8d5a59b05cbf73374a3166734974b0bb0b8b6c62b2094d3  app/src/main/java/com/alothmany/wa/feature/sync/SyncScreen.kt" | sha256sum -c -
          echo "f4b9863f66258892f1ace4fafd081a3b2942038995e638e84e06f739f5cedd52  app/src/main/java/com/alothmany/wa/feature/sync/model/SyncModels.kt" | sha256sum -c -
          echo "a684fefce23c3e28fa3607c8a2c95be9c80f206f5a7c749cabfdc2e347a9941d  app/src/main/java/com/alothmany/wa/data/local/dao/Daos.kt" | sha256sum -c -
          echo "8775bf48062b343cb9e046e4ea466356407cdb37286dd80ff6ac295df5f47e74  app/src/main/java/com/alothmany/wa/data/local/dao/SyncDaos.kt" | sha256sum -c -
          echo "b2683b7b91576f7ee96fca517187b04e4a4950729178554aba37fea4ceb88be4  app/src/main/res/values/sync_strings.xml" | sha256sum -c -
          echo "6f00663728f74428e2dc620e56efa940b8c0dc671df9eb69013e7ff9f08d6fc5  app/src/main/res/values-ar/sync_strings.xml" | sha256sum -c -
          echo "b81487f6b7dad6fce98b21bbd12ffefaa56b603e62c72919613a14f1b1797ffe  app/src/main/res/xml/accessibility_service_config.xml" | sha256sum -c -
          echo "ac476d143d7b519cf1ff221dfc9d97f91fd787237025421dcbfdb59d7a5c09ec  app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV041RegressionTest.kt" | sha256sum -c -
          echo "046428715b6f38578e874a788256367b2a5c7b4ad25aa38112cbd6cdb8677e44  app/build.gradle.kts" | sha256sum -c -
          ! grep -R -n --include='*.kt' 'ContactSyncMode' app/src/main/java
          ! grep -R -n --include='*.xml' 'contact_sync_' app/src/main/res
          ! grep -R -n --include='*.kt' 'scrollForward()' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'gestureScrollForward()' app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt
          grep -q 'Inbox filters' app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV041RegressionTest.kt
          grep -q 'selectedUpdatesTabWinsOverChatListFallback' app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV041RegressionTest.kt
          grep -q 'versionName = "0.4.1"' app/build.gradle.kts
          git diff --check

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile v0.4.1
        run: ./gradlew assembleDebug --stacktrace

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-al-othmany-debug-v0.4.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit app code only after green build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/alothmany/wa/feature/sync/engine/SmartSyncEngine.kt \
            app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppGroupParser.kt \
            app/src/main/java/com/alothmany/wa/feature/sync/engine/WhatsAppScreenDetector.kt \
            app/src/main/java/com/alothmany/wa/system/accessibility/WhatsAppUiBridge.kt \
            app/src/main/java/com/alothmany/wa/system/accessibility/WAAccessibilityService.kt \
            app/src/main/java/com/alothmany/wa/feature/sync/SyncViewModel.kt \
            app/src/main/java/com/alothmany/wa/feature/sync/SyncScreen.kt \
            app/src/main/java/com/alothmany/wa/feature/sync/model/SyncModels.kt \
            app/src/main/java/com/alothmany/wa/data/local/dao/Daos.kt \
            app/src/main/java/com/alothmany/wa/data/local/dao/SyncDaos.kt \
            app/src/main/res/values/sync_strings.xml \
            app/src/main/res/values-ar/sync_strings.xml \
            app/src/main/res/xml/accessibility_service_config.xml \
            app/src/test/java/com/alothmany/wa/feature/sync/engine/WhatsAppV041RegressionTest.kt \
            app/build.gradle.kts

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "v0.4.1 app code is already installed."
            exit 0
          fi

          git commit -m "Install Smart Sync v0.4.1 final [skip ci]"
          git push origin main
